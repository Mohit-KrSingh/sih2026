name: edutrace

services:
  db:
    image: postgres:16-alpine
    container_name: apaar_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apaar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apaar_password}
      POSTGRES_DB: ${POSTGRES_DB:-apaar_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apaar -d apaar_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apaar_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apaar_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://apaar:apaar_password@db:5432/apaar_db
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=http://localhost:5173
      - DEMO_MODE=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage/uploads:/app/storage/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apaar_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
