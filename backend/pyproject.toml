[project]
name = "apaar-backend"
version = "0.1.0"
description = "APAAR Student Data Management and Verification System API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "pandas>=2.2.3",
    "rapidfuzz>=3.10.1",
    "scikit-learn>=1.5.2",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "pyotp>=2.9.0",
    "cryptography>=43.0.3",
    "pynacl>=1.5.0",
    "qrcode>=8.0",
    "reportlab>=4.2.5",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.12",
    "faker>=30.8.2",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest_tmp"
